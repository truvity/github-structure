# Tag-triggered release — the shared implementation (truvity/ci-workflows).
# A library repository: the release is the git tag (Go module versioning)
# plus a GitHub Release with the changelog.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: truvity/ci-workflows/.github/workflows/release-public.yaml@b7ae25de542d56f329455d8603863c86cfc04f02 # v5.6.4
