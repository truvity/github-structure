# Tag-triggered release — the shared implementation (truvity/ci-workflows).
# A library repository: the release is the git tag (Go module versioning)
# plus a GitHub Release with the changelog.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: truvity/ci-workflows/.github/workflows/release-public.yaml@73ba38508f51c1e870f8981e6498c6c50d412e98 # v5.11.0
