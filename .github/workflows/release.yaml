# Tag-triggered release — the shared implementation (truvity/ci-workflows).
# A library repository: the release is the git tag (Go module versioning)
# plus a GitHub Release with the changelog.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: truvity/ci-workflows/.github/workflows/release-public.yaml@d4350d573f67de8f7a145a4de94c392c6b43fd8c # v5.0.0
