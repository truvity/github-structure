# Tag-triggered release — the shared implementation (truvity/ci-workflows).
# A library repository: the release is the git tag (Go module versioning)
# plus a GitHub Release with the changelog.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: truvity/ci-workflows/.github/workflows/release-public.yaml@b14a5741359aebd7ba377d1822651b2d188832e8 # v2.22.1
