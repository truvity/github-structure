name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@43cffb6f220a3efa7de1cf5c79232cf21117e365 # v3.26.4
    with:
      recipes: '["vuln"]'
