name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@c1478a8032d4e7d3141bc47768dbee7b3cee8c6b # v3.28.0
    with:
      recipes: '["vuln"]'
