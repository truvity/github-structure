name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@cde15d963ff2fadebf262680f565fc82c9bbc14b # v5.6.2
    with:
      recipes: '["vuln"]'
