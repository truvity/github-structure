name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@1deba8589700d0d5ba433f4790cdacc208f166c5 # v3.13.0
    with:
      recipes: '["vuln"]'
