name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@415de2d6183dc584b6536ce4a45d9c65e0dcd88d # v2.28.0
    with:
      recipes: '["vuln"]'
