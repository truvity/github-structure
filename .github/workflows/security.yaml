name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@b14a5741359aebd7ba377d1822651b2d188832e8 # v2.22.1
    with:
      recipes: '["vuln"]'
