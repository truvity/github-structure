name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@1df9a7bb066901012cc7da62580f85ffc584a337 # v2.24.0
    with:
      recipes: '["vuln"]'
