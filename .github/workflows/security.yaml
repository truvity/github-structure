name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@a15740fdccb59ef139f6eb974f0ea052cfcc28bb # v5.10.0
    with:
      recipes: '["vuln"]'
