name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@217f2eab96a85bdd2293b3c640b012745ce4a64d # v2.21.1
    with:
      recipes: '["vuln"]'
