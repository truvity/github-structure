name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@968147418b5df03a0a2c0aa66ed13cba49718b76 # v2.16.2
    with:
      recipes: '["vuln"]'
