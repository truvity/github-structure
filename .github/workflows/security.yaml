name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@73ba38508f51c1e870f8981e6498c6c50d412e98 # v5.11.0
    with:
      recipes: '["vuln"]'
