name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@b19968438f6f19b681517c4e2cfcb87fe7887673 # v2.16.3
    with:
      recipes: '["vuln"]'
