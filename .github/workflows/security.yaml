name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@6891bcb9c3e9e57dc33dc8dcca0462c32ee4afb6 # v2.22.0
    with:
      recipes: '["vuln"]'
